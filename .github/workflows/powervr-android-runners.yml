name: PowerVR Android runners

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: powervr-android-runners-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018

jobs:
  compilers:
    uses: ./.github/workflows/ick-compilers.yml

  package-android-runners:
    needs: compilers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out the qualified stage interface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
          path: .ai-ci-ick
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: shader-ick-*
          path: .ick-toolchains
          merge-multiple: true
      - name: Restore the two installed C frontends
        run: make -f tools/ick-toolchains.mk restore

      - name: Install Android NDK on the build host
        shell: bash
        run: |
          set -euo pipefail
          sdk_root=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)
          fi
          test -n "$sdkmanager" -a -x "$sdkmanager"
          "$sdkmanager" "ndk;${NDK_VERSION}" >/dev/null
          test -d "$sdk_root/ndk/${NDK_VERSION}"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"

      - name: Cross-compile and package phone and tablet runners
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)

          ndk="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p dist

          shaders=(
            set-pixel-3-rgb-52-39-182.frag
            set-block-32x32-rgb-52-39-182.frag
            dot-vector4-covector4.frag
            dot-vector32-covector32.frag
            subtract-vector8-norm.frag
            rotate-difference8-to-e1.frag
          )

          package_target() {
            local target=$1
            local abi=$2
            local archive=$3
            local stage="dist/stage-${target}"

            rm -rf "$stage"
            mkdir -p "$stage/bin" "$stage/libexec" "$stage/generated" "$stage/share/powervr"

            make -f tools/ick-android.mk runner ABI="$abi" NDK="$ndk" \
              ICK_STAGE="$PWD/build/ick/$abi" \
              RUNNER="$PWD/$stage/libexec/powervr-primitives"
            rm "$stage/libexec/powervr-primitives.s" "$stage/libexec/powervr-primitives.o"
            "$toolchain/llvm-strip" "$stage/libexec/powervr-primitives"

            cp tools/accept_powervr_android.sh "$stage/bin/powervr-accept"
            chmod 0755 "$stage/bin/powervr-accept" "$stage/libexec/powervr-primitives"

            printf '%s\n' "$source_sha" > "$stage/share/powervr/source-commit"
            printf '%s\n' "$target" > "$stage/share/powervr/package-target"
            printf '%s\n' "$abi" > "$stage/share/powervr/package-abi"
            : > "$stage/share/powervr/shader-blobs.txt"

            for shader in "${shaders[@]}"; do
              path="generated/$shader"
              expected_blob=$(git rev-parse "$source_sha:$path")
              actual_blob=$(git hash-object "$path")
              test "$actual_blob" = "$expected_blob"
              printf 'shader.blob: %s %s\n' "$actual_blob" "$path" \
                >> "$stage/share/powervr/shader-blobs.txt"
              cp "$path" "$stage/generated/$shader"
            done

            (
              cd "$stage"
              sha256sum \
                bin/powervr-accept \
                libexec/powervr-primitives \
                generated/*.frag \
                share/powervr/source-commit \
                share/powervr/package-target \
                share/powervr/package-abi \
                share/powervr/shader-blobs.txt \
                > share/powervr/manifest.sha256
            )

            "$toolchain/llvm-readelf" -h "$stage/libexec/powervr-primitives"
            tar -C "$stage" -czf "dist/$archive" .
            sha256sum "dist/$archive" > "dist/$archive.sha256"
          }

          package_target phone armeabi-v7a \
            powervr-runner-phone-armeabi-v7a.tar.gz
          package_target tablet arm64-v8a \
            powervr-runner-tablet-arm64-v8a.tar.gz

          cat dist/*.sha256

      - name: Publish exact-commit Android packages
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          short=${source_sha:0:12}
          tag="powervr-android-$short"
          assets=(
            dist/powervr-runner-phone-armeabi-v7a.tar.gz
            dist/powervr-runner-phone-armeabi-v7a.tar.gz.sha256
            dist/powervr-runner-tablet-arm64-v8a.tar.gz
            dist/powervr-runner-tablet-arm64-v8a.tar.gz.sha256
          )

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$source_sha" \
              --prerelease \
              --title "PowerVR Android runners $short" \
              --notes "Cloud-cross-compiled Android acceptance runners for exact source commit $source_sha. Phone and tablet are runtime consumers; this release is packaging evidence, not physical PowerVR execution evidence."
          fi
