name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IDRIS2: ${{ github.workspace }}/.idric-compiler-api/_/build/exec/idris2
  IDRIS2_PREFIX: ${{ github.workspace }}/.idric-compiler-api/_/bootstrap-build
  CHEZ: ${{ github.workspace }}/.idric-compiler-api/_/.tools/bin/scheme

jobs:
  idris-to-glsl:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            chezscheme glslang-tools libgmp-dev \
            libegl1-mesa-dev libgles2-mesa-dev

      - name: Check out the pinned Idriç compiler API
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/Idric
          ref: 2734ac5a86610eddfab73b1644d72b4ac85a65ee
          path: .idric-compiler-api
          persist-credentials: false

      - name: Bootstrap the pinned Idriç compiler
        # This inherited entrypoint builds compiler dependencies. Consumer native
        # compile/link remains the separately declared ICK stage below.
        working-directory: .idric-compiler-api
        run: ./edric bootstrap

      - name: Install the pinned Idriç compiler API
        working-directory: .idric-compiler-api/_
        run: ${{ env.IDRIS2 }} --install idris2api.ipkg

      - name: Record the actual Idriç compiler version
        run: ${{ env.IDRIS2 }} --version

      - name: Build the C runner frontend
        id: ick
        uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
      - name: Check out the C stage contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
          path: .aici-host
          sparse-checkout: |
            src/aici.c
            contracts/build-toolchain-v0.contract.tsv
          persist-credentials: false
      - name: Verify the C runner stages
        run: make -f ci/Makefile verify ICK="${{ steps.ick.outputs.compiler }}"

      - name: Run complete backend checks
        run: make check

      - name: Execute Android GLES framebuffer probes under Mesa
        run: |
          make powervr-primitives ICK="${{ steps.ick.outputs.compiler }}" GLES_LIBS=-lGLESv2
          EGL_PLATFORM=surfaceless ./build/powervr-primitives

      - name: Reject uncommitted generated output
        run: git diff --exit-code -- generated
