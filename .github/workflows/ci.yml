name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IDRIS2: ${{ github.workspace }}/.idric-compiler-api/_/build/exec/idris2
  IDRIS2_PREFIX: ${{ github.workspace }}/.idric-compiler-api/_/bootstrap-build
  CHEZ: ${{ github.workspace }}/.idric-compiler-api/_/.tools/bin/scheme

jobs:
  idris-to-glsl:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            chezscheme glslang-tools libgmp-dev \
            libegl1-mesa-dev libgles2-mesa-dev

      - name: Check out the pinned Idriç compiler API
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/Idric
          ref: 2734ac5a86610eddfab73b1644d72b4ac85a65ee
          path: .idric-compiler-api
          persist-credentials: false

      - name: Prepare the ICK frontend for native stages
        id: ick
        uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8

      - name: Bootstrap the pinned Idriç compiler
        # Native compiler support also uses the declared ICK stage, not an
        # undeclared host compiler. The GLES runner is a separate ICK consumer.
        working-directory: .idric-compiler-api
        env:
          CC: ${{ steps.ick.outputs.compiler }}
          CFLAGS: -fno-link-libatomic -static-libgcc
        run: ./edric bootstrap

      - name: Install the pinned Idriç compiler API
        working-directory: .idric-compiler-api/_
        run: ${{ env.IDRIS2 }} --install idris2api.ipkg

      - name: Record the actual Idriç compiler version
        run: ${{ env.IDRIS2 }} --version

      - name: Check out the C stage contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
          path: .aici-host
          sparse-checkout: |
            src/aici.c
            contracts/build-toolchain-v0.contract.tsv
          persist-credentials: false
      - name: Verify the C runner stages
        run: make -f ci/Makefile verify ICK="${{ steps.ick.outputs.compiler }}"

      - name: Typecheck NVIDIA target specifications and proofs
        run: ${{ env.IDRIS2 }} --build nvidia-target-specifications.ipkg

      - name: Check out the accepted Ithon host frontend
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: dilapidated-shed/ithon
          ref: 9d530f4ad51f5b0a09c3e74dbe45cac5bb6d52d3
          path: .ithon
          persist-credentials: false

      - name: Check out pinned Ike
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ike
          ref: 71178c348dd4621bd999ebdb6b0b60bac03fc85d
          path: .ike-host
          persist-credentials: false

      - name: Compile pinned Ike with the qualified C frontend
        run: |
          "${{ steps.ick.outputs.compiler }}" -fno-link-libatomic \
            -std=c11 -Wall -Wextra -Wpedantic -Werror -O2 \
            .ike-host/ike.c -o "$RUNNER_TEMP/ike"

      - name: Run complete backend checks
        # Ike owns the required outer graph; retained Make is its legacy leaf.
        env:
          ITHON: ${{ github.workspace }}/.ithon/ithon
        run: |
          IKE_RECEIPT="$RUNNER_TEMP/primary.ike.tsv" \
          IKE_IKEFILE_IDENTITY="sha256:$(sha256sum Ikefile | cut -d ' ' -f 1)" \
            "$RUNNER_TEMP/ike" check

      - name: Check out the independent Ike gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: fada3841bc119c9b64e4076a56b2dffedf0a9d8b
          path: .aici-gpu
          sparse-checkout: gpu-follower
          persist-credentials: false

      - name: Independently verify primary Ike execution
        run: |
          ITHON_PYTHON=python3 .ithon/ithon \
            .aici-gpu/gpu-follower/verify_ike.pi \
            "$RUNNER_TEMP/primary.ike.tsv" Ikefile check \
            'POSIX-system()' ci/gpu-plans/primary.tsv
          sha256sum "$RUNNER_TEMP/ike" "$RUNNER_TEMP/primary.ike.tsv"

      - name: Retain the primary execution receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: primary-ike-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/primary.ike.tsv
          if-no-files-found: error

      - name: Execute Android GLES framebuffer probes under Mesa
        run: |
          make powervr-primitives ICK="${{ steps.ick.outputs.compiler }}" GLES_LIBS=-lGLESv2
          EGL_PLATFORM=surfaceless ./build/powervr-primitives

      - name: Reject uncommitted generated output
        run: git diff --exit-code -- generated
