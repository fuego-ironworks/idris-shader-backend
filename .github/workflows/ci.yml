name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IDRIS2_VERSION: 0.8.0

jobs:
  idris-to-glsl:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            chezscheme glslang-tools libgmp-dev \
            libegl1-mesa-dev libgles2-mesa-dev

      - name: Restore Idris 2 compiler and API
        id: idris-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.idris2
          key: idris2-${{ runner.os }}-${{ runner.arch }}-${{ env.IDRIS2_VERSION }}-ubuntu-api-v1

      - name: Build Idris 2 and compiler API
        if: steps.idris-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "v${IDRIS2_VERSION}" \
            https://github.com/idris-lang/Idris2.git /tmp/Idris2
          make -C /tmp/Idris2 bootstrap SCHEME=chezscheme
          make -C /tmp/Idris2 install
          export PATH="$HOME/.idris2/bin:$PATH"
          make -C /tmp/Idris2 clean
          make -C /tmp/Idris2 all
          make -C /tmp/Idris2 install
          make -C /tmp/Idris2 install-api

      - name: Put Idris 2 on PATH
        run: echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"

      - name: Record compiler version
        run: idris2 --version

      - name: Build the C runner frontend
        id: ick
        uses: isomorphisms/ai-ci/ick-host@903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
      - name: Check out the C stage contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 903b2cb27ea572c9c6cb2ffa9f39e0fbf06ec9f8
          path: .aici-host
          sparse-checkout: |
            src/aici.c
            contracts/build-toolchain-v0.contract.tsv
          persist-credentials: false
      - name: Verify the C runner stages
        run: make -f ci/Makefile verify ICK="${{ steps.ick.outputs.compiler }}"

      - name: Run complete backend checks
        run: make check

      - name: Execute Android GLES framebuffer probes under Mesa
        run: |
          make powervr-primitives ICK="${{ steps.ick.outputs.compiler }}" GLES_LIBS=-lGLESv2
          EGL_PLATFORM=surfaceless ./build/powervr-primitives

      - name: Reject uncommitted generated output
        run: git diff --exit-code -- generated
